# Docker Compose — استقرار تولید روی Linux (PRD §۵۲)
# این فایل در سندباکس توسعه اجرا/آزمون نشده است (Docker در دسترس نیست) — وضعیت در docs/RTM.md
# پیش‌نیازها: میزبان linux/amd64، RAM ۱۶–۲۴ گیگ، فضای کافی طبق فرمول §۳۷ (منابع ~۱۰۰GB در ۱۰GB جا نمی‌شوند — §۱)
services:
  proxy:
    image: caddy:2.8-alpine
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile.prod:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [web, api]
    restart: unless-stopped
    mem_limit: 128m

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    restart: unless-stopped
    mem_limit: 1g
    environment:
      - NODE_ENV=production
    read_only: true
    tmpfs: ["/tmp:size=64m"]
    depends_on: [api]

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    restart: unless-stopped
    mem_limit: 768m
    environment:
      - NOOR_HTTP_PORT=8080
      - NOOR_DATA_DIR=/data
      - NOOR_SOURCES_DIR=/sources
      - NOOR_COOKIE_SECURE=true
      - NOOR_SERVICE_TOKEN=${NOOR_SERVICE_TOKEN:?service token الزامی است}
      - NOOR_ENGINE=opensearch
      - NOOR_OPENSEARCH_URL=https://opensearch:9200
      - NOOR_OPENSEARCH_USER=noor_api
      - NOOR_OPENSEARCH_PASSWORD=${NOOR_OS_PASSWORD:?opensearch password الزامی است}
    volumes:
      # منابع اصلی فقط‌خواندنی — هرگز در image کپی نمی‌شوند (DATA-01)
      - ${NOOR_SOURCES_HOST:?مسیر منابع روی میزبان}:/sources:ro
      # دادهٔ برنامه — فقط API نویسنده است (§۳۹)
      - app_data:/data
    read_only: true
    tmpfs: ["/tmp:size=64m"]
    depends_on: [opensearch]

  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    restart: unless-stopped
    mem_limit: 1536m
    command: ["worker"]
    environment:
      - NOOR_HTTP_PORT=8080
      - NOOR_DATA_DIR=/data
      - NOOR_SOURCES_DIR=/sources
      - NOOR_SERVICE_TOKEN=${NOOR_SERVICE_TOKEN}
    volumes:
      - ${NOOR_SOURCES_HOST}:/sources:ro
      - app_data:/data
      # مشتقات (نسل نمایه) — worker نویسنده، API فقط‌خواندنی
      - derived_data:/derived
    read_only: true
    tmpfs: ["/tmp:size=256m"]
    depends_on: [api]
    # یک کار سنگین فعال — §۳۸

  opensearch:
    image: opensearchproject/opensearch:2.17.1
    restart: unless-stopped
    mem_limit: 8g
    environment:
      - discovery.type=single-node
      - OPENSEARCH_JAVA_OPTS=-Xms4g -Xmx4g
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${NOOR_OS_ADMIN_PASSWORD:?الزامی}
      - plugins.security.ssl.http.enabled=true
      - bootstrap.memory_lock=true
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    volumes:
      - os_data:/usr/share/opensearch/data
    # فقط شبکهٔ داخلی — پورت به اینترنت منتشر نمی‌شود (SEC-07)
    healthcheck:
      test: ["CMD-SHELL", "curl -sk https://localhost:9200 >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 10

volumes:
  caddy_data:
  app_data:
  derived_data:
  os_data:
