# Docker Compose — استقرار تولید روی Linux (PRD §۵۲)
# وضعیت: در سندباکس Docker نصب نیست (بدون دسترسی root)؛ از بند د-۱۰ گزارش، مانع دقیق ثبت شده است.
# پس از ج-۷: Next دیگر DATABASE_URL/Prisma ندارد — همهٔ داده‌ها در api (app.sqlite) است.
# پیش‌نیازها: میزبان linux/amd64، RAM ۱۶–۲۴ گیگ، فضای کافی طبق فرمول §۳۷ (منابع ~۱۰۰GB در ۱۰GB جا نمی‌شوند — §۱)
services:
  proxy:
    image: caddy:2.8-alpine
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile.prod:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [web, api]
    restart: unless-stopped
    mem_limit: 128m

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    restart: unless-stopped
    mem_limit: 1g
    environment:
      - NODE_ENV=production
      # د-۹: نشانی داخلی Go API و مسیر خروجی PDF (روی volume) — بدون secret در کد
      - NOOR_API_INTERNAL_URL=http://api:8080
      - NOOR_PDF_EXPORT_DIR=/data/pdf-exports
      - NOOR_CHROME_PATH=/usr/bin/chromium-browser
      - NOOR_FONT_DIR=/app/fonts-pdf
      # توکن سرویس برای runner PDF (از env میزبان؛ §۳۹ بدون secret در کد)
      - NOOR_SERVICE_TOKEN=${NOOR_SERVICE_TOKEN:?service token الزامی است}
    volumes:
      # د-۹: خروجی PDF روی volume — با read_only rootfs سازگار است
      - pdf_out:/data/pdf-exports
    read_only: true
    tmpfs: ["/tmp:size=64m"]
    depends_on: [api]

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    restart: unless-stopped
    mem_limit: 768m
    environment:
      - NOOR_HTTP_PORT=8080
      - NOOR_DATA_DIR=/data
      - NOOR_SOURCES_DIR=/sources
      - NOOR_COOKIE_SECURE=true
      - NOOR_SERVICE_TOKEN=${NOOR_SERVICE_TOKEN:?service token الزامی است}
      - NOOR_ENGINE=opensearch
      - NOOR_OPENSEARCH_URL=https://opensearch:9200
      - NOOR_OPENSEARCH_USER=noor_api
      - NOOR_OPENSEARCH_PASSWORD=${NOOR_OS_PASSWORD:?opensearch password الزامی است}
    volumes:
      # منابع اصلی فقط‌خواندنی — هرگز در image کپی نمی‌شوند (DATA-01)
      - ${NOOR_SOURCES_HOST:?مسیر منابع روی میزبان}:/sources:ro
      # دادهٔ برنامه — فقط API نویسنده است (§۳۹)
      - app_data:/data
    read_only: true
    tmpfs: ["/tmp:size=64m"]
    depends_on: [opensearch]

  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    restart: unless-stopped
    mem_limit: 1536m
    # جایگزین CMD پیش‌فرض تصویر («api») — واقعاً باینری worker اجرا می‌شود
    command: ["worker"]
    environment:
      - NOOR_HTTP_PORT=8080
      - NOOR_DATA_DIR=/data
      - NOOR_SOURCES_DIR=/sources
      - NOOR_SERVICE_TOKEN=${NOOR_SERVICE_TOKEN:?service token الزامی است}
      # هم‌ترازی موتور با api — worker تنها نویسندهٔ نسل نمایه است؛ بدون این،
      # bulk در OpenSearch هرگز اجرا نمی‌شود و نمایهٔ OS هرگز به‌روز نمی‌شود
      - NOOR_ENGINE=opensearch
      - NOOR_OPENSEARCH_URL=https://opensearch:9200
      - NOOR_OPENSEARCH_USER=noor_api
      - NOOR_OPENSEARCH_PASSWORD=${NOOR_OS_PASSWORD:?opensearch password الزامی است}
      # worker در کانتینر جدا است؛ نشانی api داخلی (در توسعهٔ تک‌میزبان پیش‌فرض 127.0.0.1 می‌ماند)
      - NOOR_API_INTERNAL_URL=http://api:8080
    volumes:
      - ${NOOR_SOURCES_HOST}:/sources:ro
      - app_data:/data
      # مشتقات (نسل نمایه) — worker نویسنده، API فقط‌خواندنی
      - derived_data:/derived
    read_only: true
    tmpfs: ["/tmp:size=256m"]
    depends_on: [api, opensearch]
    # باینری worker سرور HTTP ندارد → healthcheck تصویر (wget به 8080) باید خاموش شود
    healthcheck:
      disable: true
    # یک کار سنگین فعال — §۳۸

  opensearch:
    image: opensearchproject/opensearch:2.17.1
    restart: unless-stopped
    mem_limit: 8g
    environment:
      - discovery.type=single-node
      - OPENSEARCH_JAVA_OPTS=-Xms4g -Xmx4g
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${NOOR_OS_ADMIN_PASSWORD:?الزامی}
      - plugins.security.ssl.http.enabled=true
      - bootstrap.memory_lock=true
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    volumes:
      - os_data:/usr/share/opensearch/data
    # فقط شبکهٔ داخلی — پورت به اینترنت منتشر نمی‌شود (SEC-07)
    healthcheck:
      test: ["CMD-SHELL", "curl -sk https://localhost:9200 >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 10

volumes:
  caddy_data:
  app_data:
  derived_data:
  os_data:
  pdf_out:
